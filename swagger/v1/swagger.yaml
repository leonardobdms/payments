---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/merchants":
    post:
      summary: Register merchant and wallet
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '201':
          description: Created again with another document
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 270
                    legal_name: Segunda Loja
                    document: '54550752000155'
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      legal_name:
                      - can't be blank
                      document:
                      - is not a valid CNPJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant:
                  type: object
                  properties:
                    legal_name:
                      type: string
                    document:
                      type: string
                  required:
                  - legal_name
                  - document
              required:
              - merchant
    get:
      summary: List my merchants
      tags:
      - Merchants
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                  - id: 271
                    legal_name: Leffler, Schmidt and Quigley
                    document: T2NG7TT1QLNN42
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
                  - id: 272
                    legal_name: Raynor, Ward and King
                    document: U9V7JXT8VXF845
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
  "/api/v1/merchants/{id}":
    get:
      summary: Get merchant and wallet
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 273
                    legal_name: Osinski-Hauck
                    document: 452AQ9WDJHKN15
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 1000
                      pending_balance_cents: 500
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Not Found
    patch:
      summary: Update merchant
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 275
                    legal_name: Novo Nome
                    document: UPIC4CXRBAG737
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Not Found
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      legal_name:
                      - can't be blank
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant:
                  type: object
                  properties:
                    legal_name:
                      type: string
              required:
              - merchant
  "/api/v1/me":
    get:
      summary: Get my profile information
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 1128
                    email: henrietta@weissnat.example
                    name: Joane Kerluke
                    cpf: '04906160620'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
    patch:
      summary: Update my profile information
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 1129
                    email: shakita.pacocha@gorczany.example
                    name: Novo Nome
                    cpf: '07746983812'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      email:
                      - is not a valid address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
                    cpf:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
              required:
              - user
    delete:
      summary: Delete my account
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                example:
                  value: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
  "/api/v1/register":
    post:
      summary: Create a new user account
      tags:
      - Users - Register
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMTMyLCJleHAiOjE3ODU4NjU5OTd9.sQ57t4Irj5Eiwc3BIIGr9PH0VVHC5Cc9u_2Xv2G9YoI
                    refresh_token: EkKAFB3wzevXhjK_LXwjblArn4kGfaLDSHwmQwHazTk
                    user:
                      id: 1132
                      email: erlene@hudson-konopelski.example
                      name: Novo Usuario
                      cpf: '08349494905'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      email:
                      - has already been taken
                      cpf:
                      - has already been taken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
                    cpf:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                  required:
                  - email
                  - name
                  - cpf
                  - password
                  - password_confirmation
              required:
              - user
  "/api/v1/login":
    post:
      summary: Authenticate user and return token
      tags:
      - Users - Login
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMTM0LCJleHAiOjE3ODU4NjU5OTd9.p6FiSJv2pxi7W0VfWi1kDzs7yWUwDCTQrfzir0FVBME
                    refresh_token: HrUsb3e4qBfQZ1UfaveLOud_KxOcjBZ9m59fLYdtRsg
                    user:
                      id: 1134
                      email: tuan_leuschke@olson.example
                      name: Georgianna Zemlak
                      cpf: '09117047013'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/refresh":
    post:
      summary: Refresh access and refresh tokens
      tags:
      - Users - Session
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMTM2LCJleHAiOjE3ODU4NjU5OTh9.15T9CNcrcLnN6VweVwe4Xuyt7SRm1txormhYBIG9lEg
                    refresh_token: IbNZpZHbbKnpJpuJGsyDkwvVnri_D_PwAoQOQVKdIbs
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/logout":
    delete:
      summary: Logout current user
      tags:
      - Users - Session
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                example:
                  value: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      in: header
