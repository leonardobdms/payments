---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/merchants":
    post:
      summary: Register merchant and wallet
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '201':
          description: Created again with another document
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 43
                    legal_name: Segunda Loja
                    document: '54550752000155'
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      legal_name:
                      - can't be blank
                      document:
                      - is not a valid CNPJ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant:
                  type: object
                  properties:
                    legal_name:
                      type: string
                    document:
                      type: string
                      pattern: "^\\d{14}$"
                      description: CNPJ (14 digits)
                  required:
                  - legal_name
                  - document
              required:
              - merchant
    get:
      summary: List my merchants
      tags:
      - Merchants
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                  - id: 44
                    legal_name: Kozey-McCullough
                    document: TIDDVLLWBZ9E20
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
                  - id: 45
                    legal_name: Simonis-Murray
                    document: CKHRSCANE2JJ10
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
  "/api/v1/merchants/{id}":
    get:
      summary: Get merchant and wallet
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 46
                    legal_name: Kihn-Johnston
                    document: XIV3GW4ASJPF84
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 1000
                      pending_balance_cents: 500
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Not Found
    patch:
      summary: Update merchant
      tags:
      - Merchants
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 48
                    legal_name: Novo Nome
                    document: B5XAYCFIHBQR46
                    status: active
                    account:
                      currency: BRL
                      available_balance_cents: 0
                      pending_balance_cents: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Not Found
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      legal_name:
                      - can't be blank
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant:
                  type: object
                  properties:
                    legal_name:
                      type: string
              required:
              - merchant
  "/api/v1/me":
    get:
      summary: Get my profile information
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 102
                    email: shaun.glover@hudson.example
                    name: Debra Runolfsson
                    cpf: '03219889573'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
    patch:
      summary: Update my profile information
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    id: 103
                    email: ellis@marvin-will.test
                    name: Novo Nome
                    cpf: '07495869585'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      email:
                      - is not a valid address
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    name:
                      type: string
                    cpf:
                      type: string
                      pattern: "^\\d{11}$"
                    password:
                      type: string
                      format: password
                      minLength: 8
                    password_confirmation:
                      type: string
                      format: password
                      minLength: 8
              required:
              - user
    delete:
      summary: Delete my account
      tags:
      - Users - Me
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                example:
                  value: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
  "/api/v1/register":
    post:
      summary: Create a new user account
      tags:
      - Users - Register
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMDYsImV4cCI6MTc4NjE5OTUxOH0.BeF0ninblqy0jNoqM7OpjtpJAGBD3Qonit_Eim21gzc
                    refresh_token: 3m8LHj5Qa-WuQj6r1h5BoBren1y71MoyLoySvncDAJg
                    user:
                      id: 106
                      email: judith@labadie.example
                      name: Novo Usuario
                      cpf: '03419603576'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              examples:
                example:
                  value:
                    errors:
                      email:
                      - has already been taken
                      cpf:
                      - has already been taken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    name:
                      type: string
                    cpf:
                      type: string
                      pattern: "^\\d{11}$"
                    password:
                      type: string
                      format: password
                      minLength: 8
                    password_confirmation:
                      type: string
                      format: password
                      minLength: 8
                  required:
                  - email
                  - name
                  - cpf
                  - password
                  - password_confirmation
              required:
              - user
  "/api/v1/login":
    post:
      summary: Authenticate user and return token
      tags:
      - Users - Login
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMDgsImV4cCI6MTc4NjE5OTUxOH0.QpZHkUtDjdP2tdzy-eYSPF7qNHlBmO-VtTo4shUHxFg
                    refresh_token: m44zLFclRVXFrvWzXcpd1_M8oEE1hdq_ucZovd3akC8
                    user:
                      id: 108
                      email: celestina_paucek@mcclure.test
                      name: Toney D'Amore
                      cpf: '09387714772'
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      format: password
                      minLength: 8
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/refresh":
    post:
      summary: Refresh access and refresh tokens
      tags:
      - Users - Session
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                example:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxMTAsImV4cCI6MTc4NjE5OTUxOH0.UvY-A_SnxSEzyoi8A8sY2IXfnq1jXkHIOOxocTIMv_k
                    refresh_token: sSTKOVB_7AjlCDiQZkcyB4gqyPzmGILb_UK1wp9tESg
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/logout":
    delete:
      summary: Logout current user
      tags:
      - Users - Session
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '204':
          description: No Content
          content:
            application/json:
              examples:
                example:
                  value: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example:
                  value:
                    error: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      in: header
