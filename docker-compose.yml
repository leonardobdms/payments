services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: payments-app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: payments_password
      DATABASE_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "bash",
        "-c",
        "rm -f tmp/pids/server.pid && bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0",
      ]

  db:
    image: postgres:16-alpine
    container_name: payments-db
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_password
      POSTGRES_DB: payments_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
